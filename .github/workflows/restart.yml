name: MAGMA API Auto Restart

on:
  workflow_run:
    workflows:
      - "MAGMA Music API"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart-api:

    if: |
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'

    runs-on: ubuntu-latest

    steps:

      - name: Wait Before Restart
        run: |
          echo "Previous MAGMA API run ended."
          echo "Waiting 20 seconds..."
          sleep 20

      - name: Start Next API Run
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "       RESTARTING MAGMA API"
          echo "======================================"

          gh workflow run main.yml \
            --repo "${{ github.repository }}" \
            --ref main

          echo "✅ Next MAGMA API run triggered."