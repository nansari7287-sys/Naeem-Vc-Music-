name: MAGMA Music

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================
      # SYSTEM DEPENDENCIES
      # =========================
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git

      # =========================
      # PYTHON DEPENDENCIES
      # =========================
      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # CHECK ENV
      # =========================
      - name: Check Environment
        run: |
          if [ ! -f .env ]; then
            echo "❌ .env file not found!"
            exit 1
          fi

          echo "✅ .env found."

      # =========================
      # START MAGMA MUSIC
      # =========================
      - name: Start MagmaMusic
        run: |
          echo "======================================"
          echo "        🚀 STARTING MAGMAMUSIC"
          echo "======================================"

          python3 -m Anysnap

      # =========================
      # CLEANUP
      # =========================
      - name: Cleanup
        if: always()
        run: |
          echo "MagmaMusic workflow finished."